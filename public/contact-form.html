<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | My Server</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dark.css">
  <script src="/theme.js"></script>
  <style>
    .form-container {
      max-width: 500px;
      margin: 2rem auto;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    input,
    textarea {
      width: 100%;
      padding: 0.75rem;
      font: inherit;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 150px;
    }

    .error-message {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 0.25rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    input.invalid,
    textarea.invalid {
      border-color: #dc2626;
    }

    .submit-button {
      width: 100%;
      padding: 0.85rem;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: #4f46e5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s;
    }

    .submit-button:hover {
      background: #4338ca;
    }

    .submit-button:active {
      transform: scale(0.98);
    }

    .submit-button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }

    .success-message {
      display: none;
      padding: 1rem;
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .success-message.show {
      display: block;
    }

    /* Dark mode overrides */
    [data-theme="dark"] label {
      color: #f9fafb;
    }

    [data-theme="dark"] input,
    [data-theme="dark"] textarea {
      background: #1f2937;
      color: #f9fafb;
      border-color: #374151;
    }

    [data-theme="dark"] input:focus,
    [data-theme="dark"] textarea:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.1);
    }

    [data-theme="dark"] input.invalid,
    [data-theme="dark"] textarea.invalid {
      border-color: #f87171;
    }

    [data-theme="dark"] .success-message {
      background: #064e3b;
      color: #d1fae5;
      border-color: #047857;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">My Server</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact-form.html" class="active">Contact</a></li>
        <li><button class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="form-container">
      <h1>Get in Touch</h1>
      <p style="color: #6b7280; margin-bottom: 2rem;">We'd love to hear from you. Send us a message!</p>

      <div class="success-message" id="success-message">
        <p>✓ Thanks for reaching out! We'll get back to you soon.</p>
      </div>

      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
          <div class="error-message" id="name-error"></div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
          <div class="error-message" id="email-error"></div>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
          <div class="error-message" id="message-error"></div>
        </div>

        <button type="submit" class="submit-button">Send Message</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 My Server</p>
      <a href="https://github.com/eyalil/my-server" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </footer>

  <script>
    const form = document.getElementById('contact-form');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const messageInput = document.getElementById('message');
    const successMessage = document.getElementById('success-message');

    const inputs = { name: nameInput, email: emailInput, message: messageInput };
    const errors = {
      name: document.getElementById('name-error'),
      email: document.getElementById('email-error'),
      message: document.getElementById('message-error')
    };

    // Clear error when user starts typing
    Object.entries(inputs).forEach(([key, input]) => {
      input.addEventListener('input', () => {
        clearError(key);
      });
    });

    function clearError(field) {
      inputs[field].classList.remove('invalid');
      errors[field].classList.remove('show');
    }

    function showError(field, message) {
      inputs[field].classList.add('invalid');
      errors[field].textContent = message;
      errors[field].classList.add('show');
    }

    function validateForm() {
      let isValid = true;

      const name = nameInput.value.trim();
      if (!name) {
        showError('name', 'Please enter your name.');
        isValid = false;
      } else if (name.length < 2) {
        showError('name', 'Name must be at least 2 characters.');
        isValid = false;
      }

      const email = emailInput.value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email) {
        showError('email', 'Please enter your email.');
        isValid = false;
      } else if (!emailRegex.test(email)) {
        showError('email', 'Please enter a valid email address.');
        isValid = false;
      }

      const message = messageInput.value.trim();
      if (!message) {
        showError('message', 'Please enter a message.');
        isValid = false;
      } else if (message.length < 10) {
        showError('message', 'Message must be at least 10 characters.');
        isValid = false;
      }

      return isValid;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      if (!validateForm()) {
        return;
      }

      // Save to localStorage for demo purposes
      const messages = JSON.parse(localStorage.getItem('contact-messages') || '[]');
      messages.push({
        id: Date.now(),
        name: nameInput.value.trim(),
        email: emailInput.value.trim(),
        message: messageInput.value.trim(),
        timestamp: new Date().toISOString()
      });
      localStorage.setItem('contact-messages', JSON.stringify(messages));

      // Show success message
      successMessage.classList.add('show');
      form.reset();
      nameInput.focus();

      // Hide success message after 5 seconds
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 5000);
    });
  </script>
</body>
</html>
